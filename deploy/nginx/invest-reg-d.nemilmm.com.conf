# /etc/nginx/sites-available/invest-reg-d.nemilmm.com
#
# Regulation D 506(c) offering page. Requests whose source IP does not resolve
# to the United States receive the site's own 404 page and never receive any
# offering content — the HTML is not transmitted at all.
#
# This is the hard control. The client-side GeoGate in the app remains as
# defence-in-depth, and the address gate at the investment step is unchanged.

server {
    listen 80;
    listen [::]:80;
    server_name invest-reg-d.nemilmm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name invest-reg-d.nemilmm.com;

    ssl_certificate     /etc/letsencrypt/live/invest-reg-d.nemilmm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invest-reg-d.nemilmm.com/privkey.pem;

    root /var/www/invest-reg-d;
    index index.html;

    # Private offering — keep it out of search indexes and framing.
    add_header X-Robots-Tag        "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options     "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                   always;
    add_header Referrer-Policy     "strict-origin-when-cross-origin" always;

    # Blocked visitors get the site's own themed 404, identical to a real one.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    # Build assets: immutable, safe to cache hard. Gate still applies.
    location /_next/static/ {
        if ($reg_d_blocked) { return 404; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Product demo footage. Range requests work by default; just cache it.
    location /nemi/ {
        if ($reg_d_blocked) { return 404; }
        expires 30d;
    }

    location / {
        # Jurisdiction gate. Nothing past this line runs for a non-US source.
        if ($reg_d_blocked) { return 404; }

        # Never cache the offering HTML itself, so terms changes go live at once.
        add_header Cache-Control "no-store" always;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
