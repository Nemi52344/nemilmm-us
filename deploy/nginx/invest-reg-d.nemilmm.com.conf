# /etc/nginx/sites-available/invest-reg-d.nemilmm.com
#
# Serves the Regulation D 506(c) offering page as plain static files.
#
# No geo module, no MaxMind database, no Cloudflare dependency. Jurisdiction
# restriction is handled in the browser by components/GeoGate.tsx — see the
# note at the bottom of deploy/README.md for what that does and does not stop.

server {
    listen 80;
    listen [::]:80;
    server_name invest-reg-d.nemilmm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name invest-reg-d.nemilmm.com;

    ssl_certificate     /etc/letsencrypt/live/invest-reg-d.nemilmm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invest-reg-d.nemilmm.com/privkey.pem;

    root /var/www/invest-reg-d;
    index index.html;

    # Private offering — keep it out of search indexes and out of frames.
    add_header X-Robots-Tag           "noindex, nofollow, noarchive"    always;
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # The export ships its own themed 404 screen.
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Hashed build assets never change under the same name.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images and the Anvil/Orion footage.
    location /nemi/ {
        expires 30d;
    }

    location / {
        # Never cache the offering HTML, so terms changes go live immediately.
        add_header Cache-Control "no-store" always;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
