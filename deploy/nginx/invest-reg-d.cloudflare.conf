# /etc/nginx/sites-available/invest-reg-d.nemilmm.com
#
# ALTERNATIVE to the MaxMind/GeoIP2 version. Use this one if you would rather
# not maintain a MaxMind account and database.
#
# Requires nemilmm.com's DNS to be served by Cloudflare with the record for
# invest-reg-d PROXIED (orange cloud). Cloudflare then adds a CF-IPCountry
# header to every request, so nginx needs no geo module and no database.
#
#   No apt module. No MaxMind account. No licence key. No update timer.
#
# SECURITY NOTE: a header can be forged by anyone who reaches the origin
# directly on 13.205.20.121 and sets CF-IPCountry: US. The firewall rule in
# step 3 of the README closes that hole by only accepting 443 from Cloudflare.
# Without it, this gate is trivially bypassed.

# Default-deny: only a positively-identified US source is allowed.
# "XX" is what Cloudflare sends when it cannot determine the country, and
# "T1" is Tor — both fall to the default and are blocked.
map $http_cf_ipcountry $reg_d_blocked {
    default 1;
    US      0;
    PR      0;   # Puerto Rico      \
    GU      0;   # Guam              |  U.S. territories: US persons
    VI      0;   # U.S. Virgin Is.   |  under SEC Rule 902(k), matching
    AS      0;   # American Samoa    |  components/countries.ts
    MP      0;   # N. Mariana Is.   /
}

server {
    listen 80;
    listen [::]:80;
    server_name invest-reg-d.nemilmm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name invest-reg-d.nemilmm.com;

    ssl_certificate     /etc/letsencrypt/live/invest-reg-d.nemilmm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invest-reg-d.nemilmm.com/privkey.pem;

    root /var/www/invest-reg-d;
    index index.html;

    # Log the country so you can confirm the gate is seeing real values.
    log_format geo '$remote_addr [$http_cf_ipcountry] blocked=$reg_d_blocked '
                   '"$request" $status';
    access_log /var/log/nginx/invest-reg-d.access.log geo;

    add_header X-Robots-Tag           "noindex, nofollow, noarchive"    always;
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    location /_next/static/ {
        if ($reg_d_blocked) { return 404; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /nemi/ {
        if ($reg_d_blocked) { return 404; }
        expires 30d;
    }

    location / {
        # Jurisdiction gate. Nothing past this line runs for a non-US source.
        if ($reg_d_blocked) { return 404; }

        add_header Cache-Control "no-store" always;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
