# /etc/nginx/conf.d/geoip2.conf
#
# Country lookup for the Regulation D jurisdiction gate. Must live in the http
# context, which is why this is a conf.d snippet rather than part of the site
# file. Requires:
#
#   sudo apt install libnginx-mod-http-geoip2 geoipupdate
#
# and a MaxMind GeoLite2-Country database at the path below (see deploy/README.md).

geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    auto_reload 12h;
    $geoip2_country_code source=$remote_addr country iso_code;
}

# Default-deny. Only sources that positively resolve to the United States are
# allowed through; an unknown or unresolvable IP is treated as non-US.
#
# NOTE: this is the opposite of the client-side GeoGate, which fails OPEN so a
# flaky lookup never locks out a legitimate investor. At the edge we can afford
# to fail CLOSED, because a blocked visitor can still contact invest@nemilmm.com.
map $geoip2_country_code $reg_d_blocked {
    default 1;
    US      0;
}
